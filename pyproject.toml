[project]
name = "real-time-traffic-intelligence"
version = "0.1.0"
description = "Real‑time traffic intelligence hub combining data pipelines, ML model training, and interactive dashboards with FastAPI and Streamlit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apache-airflow==2.9.*",
  "apache-airflow-providers-apache-kafka>=1.3.0",
  "apache-airflow-providers-postgres>=5.10.0",
  "apache-airflow-providers-apache-spark>=4.8.0",
  "confluent-kafka>=2.3.0",
  "fastapi>=0.109.0",
  "httpx>=0.26.0",
  "mlflow>=2.10.0",
  "numpy>=1.26.0,<2.0.0",
  "pandas>=2.1.0",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.5.0",
  "pyspark>=3.5.0",
  "python-dotenv>=1.0.0",
  "scikit-learn>=1.4.0",
  "sqlalchemy>=2.0.25",
  "streamlit>=1.30.0",
  "uvicorn[standard]>=0.27.0",
  "xgboost>=2.0.3",
]

[dependency-groups]
dev = [
  "mypy>=1.8.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.1.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
