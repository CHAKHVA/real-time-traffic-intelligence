[project]
name = "real-time-traffic-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apache-airflow==2.9.*",
  "fastapi>=0.120.0",
  "kafka-python>=2.2.15",
  "mlflow>=3.5.1",
  "numpy>=2.3.4",
  "pandas>=2.3.3",
  "pip>=25.3",
  "pydantic>=2.12.3",
  "pyspark>=4.0.1",
  "scikit-learn>=1.7.2",
  "setuptools>=80.9.0",
  "streamlit>=1.50.0",
  "uvicorn[standard]>=0.38.0",
  "xgboost>=3.1.1",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0",
  "ruff>=0.14.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
